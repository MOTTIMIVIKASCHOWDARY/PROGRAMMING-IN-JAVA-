<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=web/index.html">
  <title>SIMR // Smart Inventory & Predictive Reorder Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f2fe'><path d='M20 7l-8-4-8 4 8 4 8-4zm0 6l-8 4-8-4v6l8 4 8-4v-6z'/></svg>">
  <script>
    window.location.replace("web/index.html");
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070b14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .loader-box {
      background: rgba(13, 19, 36, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.3);
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.15);
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
    }
    .pulse-glow {
      width: 50px;
      height: 50px;
      margin: 0 auto 20px auto;
      border: 3px solid rgba(0, 242, 254, 0.2);
      border-top-color: #00f2fe;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #00f2fe;
      margin-bottom: 10px;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    a.btn {
      display: inline-block;
      padding: 10px 24px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #070b14;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
      transition: all 0.2s;
    }
    a.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.7);
    }
  </style>
</head>
<body>
  <div class="loader-box">
    <div class="pulse-glow"></div>
    <h2>SIMR // PLATFORM</h2>
    <p>Connecting to Cyber Inventory Engine...</p>
    <a href="web/index.html" class="btn">Enter Platform &rarr;</a>
  </div>
</body>
</html>
